[project]
name = "kia_ev6_backend"
authors = [
    { name = "Kia Automation Team", email = "admin@example.com"}
]
description = "Custom Frappe/ERPNext application for Kia EV6 vehicle telemetry, automation rules, and remote command integration."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Resolved in bench environment
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
